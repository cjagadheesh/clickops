[project]
name = "clickops"
version = "0.0.1"
description = "Alerts on Slack when AWS infrastructure managed by Terraform is changed outside Terraform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
clickops = "clickops.cli:app"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,ec2,iam,lambda,route53,s3,sns,ssm,sts]>=1.35",
    "moto[all]>=5.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clickops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["clickops"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
